name: Build and Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # Populates the model cache once per operating system. Without this the three
  # test legs on an OS all start on a cold cache at the same time and every one
  # of them downloads ~46 MB from the Apache OpenNLP servers before any of them
  # has written the cache.
  #
  # Actions caches are not portable across operating systems, so a single entry
  # saved on Linux cannot be restored by the Windows or macOS legs. The key
  # carries runner.os and this job runs on each OS to populate all three.
  models:
    name: Fetch test models (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache test models
        id: cache-models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testdata
          key: testmodels-${{ runner.os }}-${{ hashFiles('build/download-test-models.ps1') }}

      - name: Download test models
        if: steps.cache-models.outputs.cache-hit != 'true'
        shell: pwsh
        run: build/download-test-models.ps1

  test:
    name: ${{ matrix.os }} / ${{ matrix.framework }}
    runs-on: ${{ matrix.os }}
    needs: models
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Test client to library under test:
        #   net10.0 -> net10.0
        #   net9.0  -> netstandard2.0  (see SetTargetFramework in the test csproj)
        #   net8.0  -> net8.0
        framework: [net10.0, net9.0, net8.0]
        # net462 -> netstandard2.0, a second client for the same library build as
        # net9.0. It is in include rather than the framework list because .NET
        # Framework only runs on Windows, so a cross product would create two
        # legs that cannot work; the test csproj drops net462 off Windows for the
        # same reason. net462 is the floor Lucene.NET supports, which is the
        # consumer this port targets.
        include:
          - os: windows-latest
            framework: net462

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nerdbank.GitVersioning derives the version from commit height, so it
          # needs the full history rather than the default shallow clone.
          fetch-depth: 0

      # Each leg needs its own runtime to execute on, plus the .NET 10 SDK to
      # build with. Installing all three keeps the setup identical across legs.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          # Only the projects this job restores. Hashing every csproj would let
          # an edit to NOpenNLP.Benchmarks, which CI never builds, throw away a
          # perfectly good cache.
          key: nuget-${{ runner.os }}-${{ hashFiles('src/NOpenNLP.Tools/*.csproj', 'src/NOpenNLP.Tools.Tests/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Restores what the models job for this OS already downloaded. The key is
      # the runner OS plus the download script, which pins each file's SHA-256,
      # so the cache is reused until the model set itself changes; no
      # restore-keys, so a stale entry can never satisfy a changed list. Keep
      # this key identical to the one in the models job.
      - name: Restore test models
        id: cache-models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testdata
          key: testmodels-${{ runner.os }}-${{ hashFiles('build/download-test-models.ps1') }}

      # Should not normally run: the models job populates the cache first. This
      # only covers a cache entry evicted between that job and this one, and the
      # script skips files already present.
      - name: Download test models (fallback)
        if: steps.cache-models.outputs.cache-hit != 'true'
        shell: pwsh
        run: build/download-test-models.ps1

      # Restores the test project (and the library through its ProjectReference)
      # rather than the solution. The solution also carries NOpenNLP.Benchmarks,
      # whose IKVM dependency unpacks to over 4 GB; a solution-wide restore
      # would download and cache that on every one of the nine legs to build
      # something no CI job runs.
      - name: Restore
        run: |
          dotnet restore src/NOpenNLP.Tools/NOpenNLP.Tools.csproj
          dotnet restore src/NOpenNLP.Tools.Tests/NOpenNLP.Tools.Tests.csproj -p:TestFrameworks=true

      # Builds the library for all of its target frameworks, so the
      # netstandard2.0 leg is compiled here even on the net10.0 run.
      - name: Build library
        run: dotnet build src/NOpenNLP.Tools/NOpenNLP.Tools.csproj --configuration Release --no-restore

      - name: Build tests (${{ matrix.framework }})
        run: >
          dotnet build src/NOpenNLP.Tools.Tests/NOpenNLP.Tools.Tests.csproj
          --configuration Release
          --framework ${{ matrix.framework }}
          --no-restore
          -p:TestFrameworks=true

      - name: Test (${{ matrix.framework }})
        run: >
          dotnet test src/NOpenNLP.Tools.Tests/NOpenNLP.Tools.Tests.csproj
          --configuration Release
          --framework ${{ matrix.framework }}
          --no-build
          --no-restore
          -p:TestFrameworks=true
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=TestResults.trx"
          --results-directory "${{ github.workspace }}/testresults"

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: testresults-${{ matrix.os }}-${{ matrix.framework }}
          path: ${{ github.workspace }}/testresults
          if-no-files-found: warn

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nerdbank.GitVersioning derives the version from commit height, so it
          # needs the full history rather than the default shallow clone.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/NOpenNLP.Tools/NOpenNLP.Tools.csproj

      # Confirms the package still builds and carries LICENSE/NOTICE, which the
      # Apache 2.0 terms on the ported OpenNLP source require us to ship.
      - name: Pack
        run: dotnet pack src/NOpenNLP.Tools/NOpenNLP.Tools.csproj --configuration Release --no-restore

      - name: Verify NOTICE and README are packaged
        shell: bash
        run: |
          set -euo pipefail
          package="$(find src/NOpenNLP.Tools/bin/Release -name '*.nupkg' ! -name '*.symbols.nupkg' | head -1)"
          echo "Inspecting $package"
          contents="$(unzip -Z1 "$package")"
          echo "$contents"
          for required in NOTICE README.md lib/net10.0/NOpenNLP.Tools.dll lib/net8.0/NOpenNLP.Tools.dll lib/netstandard2.0/NOpenNLP.Tools.dll; do
            if ! grep -qx "$required" <<<"$contents"; then
              echo "::error::$required is missing from the package"
              exit 1
            fi
          done
          echo "All required package contents are present."

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: |
            src/NOpenNLP.Tools/bin/Release/*.nupkg
            src/NOpenNLP.Tools/bin/Release/*.snupkg
